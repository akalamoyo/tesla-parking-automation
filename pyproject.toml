[project]
name = "tesla-parking-automation"
version = "0.1.0"
description = "Tesla-based parking registration automation for Dutch parking zones"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.1",
  "geopy>=2.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
tesla-parking = "app.main:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
